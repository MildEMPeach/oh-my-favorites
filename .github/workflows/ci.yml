name: CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 检查代码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release:
    name: 发布 macOS 安装包
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false

      - run: pnpm install --frozen-lockfile

      - name: 确认标签与应用版本一致
        run: |
          node -e '
            const { version } = require("./apps/desktop/package.json");
            if (process.env.GITHUB_REF_NAME !== "v" + version) {
              throw new Error("标签必须与桌面应用版本一致");
            }
          '

      - run: pnpm --filter @oh-my-favorites/shared build

      - name: 打包
        run: pnpm --filter @oh-my-favorites/desktop package --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            --verify-tag \
            --generate-notes

